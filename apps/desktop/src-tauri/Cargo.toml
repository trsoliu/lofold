[package]
name = "lofold-client"
version = "0.6.11"
edition = "2021"
publish = false

[lib]
name = "lofold_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls-no-alpn"] }
tokio = { version = "1", features = ["time", "net"] }
futures-util = "0.3"
lofold-mail-ai = { path = "../../../packages/mail-ai" }
png = "0.18"
ring = "0.17.14"
lofold-mail-network = { path = "../../../packages/mail-network" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
lofold-mail-store = { path = "../../../packages/mail-store" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"

fs2 = "0.4"
getrandom = "0.3"
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
