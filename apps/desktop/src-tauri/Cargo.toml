[package]
name = "lofold-client"
version = "0.6.0"
edition = "2021"
publish = false

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
lofold-mail-ai = { path = "../../../packages/mail-ai" }
png = "0.18"
ring = "0.17.14"
lofold-mail-network = { path = "../../../packages/mail-network" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
lofold-mail-store = { path = "../../../packages/mail-store" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
fs2 = "0.4"
getrandom = "0.3"
security-framework = "3.7"
