<body>

    <div class="identity"><span class="mark" data-icon="mail"></span><strong>本地邮箱</strong><span class="edition">原型审阅</span></div>
    <button id="open-catalog" aria-haspopup="dialog"><span data-icon="layers"></span>流程目录<span data-icon="chevron-down"></span></button>
    <div class="tools">
      <div class="modes" role="group" aria-label="预览尺寸"><button data-mode="desktop" aria-pressed="true">桌面</button><button data-mode="mobile" aria-pressed="false">手机</button></div>

    </div>

  <main id="stage" aria-label="原型预览"><div id="viewport"></div></main>

    <nav id="catalog-groups" aria-label="审阅流程"></nav>
  </dialog>
  <noscript>请启用 JavaScript 以审阅交互原型。</noscript>
