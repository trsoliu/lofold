name: iOS Simulator package

on:
  workflow_dispatch:
  push:
    branches: ['codex/lofold-platform-release']
    paths: ['.github/workflows/ios-simulator.yml', 'scripts/apple/**', 'apps/desktop/**', 'packages/**', 'Cargo.lock']

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install frontend dependencies
        run: |
          npm install -g "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ios-sim-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build the simulator application
        run: scripts/apple/build-simulator.sh
      - name: Install and launch on a simulated iPhone
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in sorted(json.load(sys.stdin)["devices"].items(),reverse=True) if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          unzip -q output/platform-release/*-iOS-Simulator-arm64.zip -d "$RUNNER_TEMP/lofold-app"
          xcrun simctl install "$device" "$RUNNER_TEMP"/lofold-app/*.app
          xcrun simctl launch "$device" org.lofold.client
          container="$(xcrun simctl get_app_container "$device" org.lofold.client data)"
          for attempt in {1..60}; do
            db="$(find "$container" -type f -name archive.sqlite3 -size +4095c -print -quit)"
            [[ -n "$db" ]] && break
            sleep 1
          done
          [[ -n "$db" ]] || { echo "Archive creation with the simulator Keychain failed."; exit 1; }
          python3 -c 'import sys; f=open(sys.argv[1],"rb"); assert f.read(16) != b"SQLite format 3\x00"' "$db"
          xcrun simctl terminate "$device" org.lofold.client
          xcrun simctl launch "$device" org.lofold.client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LoFold-iOS-Simulator-arm64
          path: output/platform-release/*-iOS-Simulator-arm64.zip
          if-no-files-found: error
