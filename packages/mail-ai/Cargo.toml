[package]
name = "lofold-mail-ai"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls-no-alpn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "time"] }
