[package]
name = "lofold-mail-store"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
hex = "0.4"
lettre = { version = "0.11.24", default-features = false }
mail-blob-codec = { path = "../mail-blob-codec" }
mail-parser = { version = "1.0.1", features = ["full_encoding"] }
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
