[package]
name = "lofold-agent-mcp"
version = "0.1.0"
edition = "2021"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
fs2 = "0.4"
libc = "0.2"
rmcp = { version = "=3.11.0", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
